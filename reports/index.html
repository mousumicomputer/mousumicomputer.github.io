<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Download Center - Mousumi Computer</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .report-card {
            background: #ffffff;
            width: 100%;
            max-width: 950px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        /* Top Branding Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-title h2 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-title p {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }
        /* Quick Date Presets */
        .date-presets {
            display: flex;
            gap: 6px;
        }
        .preset-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover, .preset-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }
        /* Grid Layout for Fields */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .date-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-control, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            color: #0f172a;
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }
        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-preview {
            background-color: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-preview:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .btn-download {
            background-color: #2563eb;
            color: white;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            .grid-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="report-card">
        <!-- Header Section -->
        <div class="brand-header">
            <div class="brand-title">
                <h2><i class="fa-solid fa-layer-group" style="color: #2563eb;"></i> Mousumi Computer</h2>
                <p>Generate and export transaction summaries and ledgers</p>
            </div>
            <div class="date-presets">
                <button type="button" class="preset-btn active" onclick="setPreset('today', this)">Today</button>
                <button type="button" class="preset-btn" onclick="setPreset('week', this)">This Week</button>
                <button type="button" class="preset-btn" onclick="setPreset('month', this)">This Month</button>
            </div>
        </div>

        <!-- Main Options Grid -->
        <div class="grid-row">
            <!-- ১. ডেট রেঞ্জ -->
            <div class="form-group">
                <label><i class="fa-regular fa-calendar-days" style="color: #64748b;"></i> Date Range</label>
                <div class="date-input-group">
                    <input type="date" class="form-control" id="startDate">
                    <span style="color: #94a3b8; font-size: 12px;">to</span>
                    <input type="date" class="form-control" id="endDate">
                </div>
            </div>

            <!-- ২. রিপোর্টের ধরন -->
            <div class="form-group">
                <label><i class="fa-solid fa-file-lines" style="color: #64748b;"></i> Report Type</label>
                <select id="reportType" class="form-control">
                    <option value="transactions">Customer Transactions Report</option>
                    <option value="sales">Sales Summary</option>
                    <option value="expense">Expense Report</option>
                    <option value="profit-loss">Profit & Loss Statement</option>
                </select>
            </div>

            <!-- ৩. ফাইল ফরম্যাট -->
            <div class="form-group">
                <label><i class="fa-solid fa-file-arrow-down" style="color: #64748b;"></i> File Format</label>
                <select id="fileFormat" class="form-control">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="excel">Excel Spreadsheet (.xlsx)</option>
                    <option value="csv">CSV File (.csv)</option>
                </select>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
            <button type="button" class="btn btn-preview" onclick="previewFirebaseReport()">
                <i class="fa-regular fa-eye"></i> Preview
            </button>
            <button type="button" class="btn btn-download" onclick="testFirebaseReport()">
    <i class="fa-solid fa-download"></i> Download Report
</button>
        </div>
    </div>


    <!-- Report Module JavaScript -->
    <script>
        // ---------------------------------------------------------
        // DATE HELPERS
        // ---------------------------------------------------------
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function setPreset(type, element) {
            document.querySelectorAll('.preset-btn')
                .forEach(btn => btn.classList.remove('active'));

            if (element) element.classList.add('active');

            const today = new Date();
            const startDateObj = new Date(today);

            if (type === 'today') {
                document.getElementById('startDate').value = formatDate(today);
                document.getElementById('endDate').value = formatDate(today);

            } else if (type === 'week') {
                // Sunday -> today
                const dayOfWeek = today.getDay();
                startDateObj.setDate(today.getDate() - dayOfWeek);

                document.getElementById('startDate').value = formatDate(startDateObj);
                document.getElementById('endDate').value = formatDate(today);

            } else if (type === 'month') {
                startDateObj.setDate(1);

                document.getElementById('startDate').value = formatDate(startDateObj);
                document.getElementById('endDate').value = formatDate(today);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const todayButton = document.querySelector('.preset-btn.active');
            setPreset('today', todayButton);
        });
    </script>


    <!-- =========================================================
         FIREBASE REPORT MODULE
         ========================================================= -->
    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            getDatabase,
            ref,
            get
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        // ---------------------------------------------------------
        // FIREBASE CONFIG
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyA1PhRiTkICNCd8sA4he3ZxKjHtIzM0d5E",
            authDomain: "mousumi-computer.firebaseapp.com",
            databaseURL: "https://mousumi-computer-default-rtdb.firebaseio.com",
            projectId: "mousumi-computer",
            storageBucket: "mousumi-computer.firebasestorage.app",
            messagingSenderId: "104820462623",
            appId: "1:104820462623:web:e3abae9533cc841463712a",
            measurementId: "G-EPYJ70W97Z"
        };


        // IMPORTANT:
        // Use the DEFAULT Firebase app name.
        // This allows the Report page to use the same Firebase Auth
        // persistence as the main Mousumi Computer page.
        const reportApp = initializeApp(firebaseConfig);
        const reportAuth = getAuth(reportApp);
        const reportDB = getDatabase(reportApp);


        // ---------------------------------------------------------
        // WAIT UNTIL FIREBASE AUTH STATE IS KNOWN
        // ---------------------------------------------------------
        let reportCurrentUser = null;

        const authReady = new Promise((resolve) => {

            let resolved = false;

            onAuthStateChanged(reportAuth, (user) => {

                reportCurrentUser = user || null;

                console.log(
                    "Report Module Auth State:",
                    user ? user.email : "NOT LOGGED IN"
                );

                if (!resolved) {
                    resolved = true;
                    resolve(user || null);
                }

            });

        });


        // ---------------------------------------------------------
        // HELPERS
        // ---------------------------------------------------------
        function toArray(value) {

            if (Array.isArray(value)) {
                return value.filter(Boolean);
            }

            if (value && typeof value === "object") {
                return Object.values(value).filter(Boolean);
            }

            return [];
        }


        function money(value) {
            return (parseFloat(value) || 0).toFixed(2);
        }


        function setDownloadButtonLoading(isLoading) {

            const button = document.querySelector(".btn-download");

            if (!button) return;

            button.disabled = isLoading;

            if (isLoading) {
                button.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
            } else {
                button.innerHTML =
                    '<i class="fa-solid fa-download"></i> Download Report';
            }
        }


        // ---------------------------------------------------------
        // TEST / FIRST LIVE REPORT DATA LOAD
        // ---------------------------------------------------------
        window.testFirebaseReport = async function () {

            try {

                setDownloadButtonLoading(true);


                // Wait for Firebase to finish checking the saved login.
                const user = await authReady;


                if (!user) {

                    setDownloadButtonLoading(false);

                    alert(
                        "Firebase Login পাওয়া যায়নি। ❌\n\n" +
                        "প্রথমে Mousumi Computer-এর মূল সফটওয়্যারে Login করুন।\n" +
                        "তারপর Reports page খুলে আবার চেষ্টা করুন।"
                    );

                    return;
                }


                // -------------------------------------------------
                // SELECTED DATE RANGE
                // -------------------------------------------------
                const startDate =
                    document.getElementById("startDate").value;

                const endDate =
                    document.getElementById("endDate").value;

                const reportType =
                    document.getElementById("reportType").value;

                const fileFormat =
                    document.getElementById("fileFormat").value;


                if (!startDate || !endDate) {

                    setDownloadButtonLoading(false);

                    alert("Start Date এবং End Date নির্বাচন করুন।");

                    return;
                }


                if (startDate > endDate) {

                    setDownloadButtonLoading(false);

                    alert(
                        "Start Date, End Date-এর পরে হতে পারবে না।"
                    );

                    return;
                }


                // -------------------------------------------------
                // GET TRANSACTIONS
                // -------------------------------------------------
                const transactionSnapshot =
                    await get(ref(reportDB, "transactions"));

                const transactionData =
                    transactionSnapshot.exists()
                        ? transactionSnapshot.val()
                        : {};

                const transactions =
                    toArray(transactionData);


                // -------------------------------------------------
                // GET CUSTOMERS
                // -------------------------------------------------
                const customerSnapshot =
                    await get(ref(reportDB, "customers"));

                const customerData =
                    customerSnapshot.exists()
                        ? customerSnapshot.val()
                        : {};

                const customers =
                    toArray(customerData);


                // -------------------------------------------------
                // DATE FILTER
                // -------------------------------------------------
                const filteredTransactions =
                    transactions.filter((tx) => {

                        if (!tx || !tx.date) return false;

                        return (
                            tx.date >= startDate &&
                            tx.date <= endDate
                        );

                    });


                // -------------------------------------------------
                // TOTALS
                // -------------------------------------------------
                let totalDebit = 0;
                let totalCredit = 0;

                filteredTransactions.forEach((tx) => {

                    totalDebit +=
                        parseFloat(tx.debit) || 0;

                    totalCredit +=
                        parseFloat(tx.credit) || 0;

                });


                // -------------------------------------------------
                // CUSTOMER NAME CHECK
                // -------------------------------------------------
                const customerMap = new Map();

                customers.forEach((customer) => {

                    if (!customer) return;

                    const id =
                        customer.id ??
                        customer.customerId;

                    if (id !== undefined && id !== null) {
                        customerMap.set(String(id), customer);
                    }

                });


                // -------------------------------------------------
                // RESTORE BUTTON
                // -------------------------------------------------
                setDownloadButtonLoading(false);


                // -------------------------------------------------
                // TEST RESULT
                // -------------------------------------------------
                alert(
                    "Firebase Connection সফল! ✅\n\n" +

                    "Login: " +
                    (user.email || "Authenticated User") +
                    "\n\n" +

                    "Customer পাওয়া গেছে: " +
                    customers.length +
                    "\n\n" +

                    "মোট Transaction: " +
                    transactions.length +
                    "\n\n" +

                    "নির্বাচিত সময়ের Transaction: " +
                    filteredTransactions.length +
                    "\n\n" +

                    "Total Debit: " +
                    money(totalDebit) +
                    "\n\n" +

                    "Total Credit: " +
                    money(totalCredit) +
                    "\n\n" +

                    "Report Type: " +
                    reportType +
                    "\n\n" +

                    "File Format: " +
                    fileFormat
                );


                // -------------------------------------------------
                // CONSOLE DATA FOR NEXT STEP
                // -------------------------------------------------
                console.log(
                    "REPORT MODULE - USER:",
                    user
                );

                console.log(
                    "REPORT MODULE - CUSTOMERS:",
                    customers
                );

                console.log(
                    "REPORT MODULE - CUSTOMER MAP:",
                    customerMap
                );

                console.log(
                    "REPORT MODULE - ALL TRANSACTIONS:",
                    transactions
                );

                console.log(
                    "REPORT MODULE - FILTERED TRANSACTIONS:",
                    filteredTransactions
                );


            } catch (error) {

                console.error(
                    "Report Firebase Error:",
                    error
                );

                setDownloadButtonLoading(false);

                alert(
                    "Firebase থেকে ডেটা আনা যায়নি। ❌\n\n" +
                    "Error:\n" +
                    (error?.message || error)
                );

            }

        };


        // ---------------------------------------------------------
        // PREVIEW - TEMPORARY TEST
        // ---------------------------------------------------------
        window.previewFirebaseReport = async function () {

            try {

                const user = await authReady;

                if (!user) {
                    alert(
                        "Firebase Login পাওয়া যায়নি।\n\n" +
                        "প্রথমে মূল সফটওয়্যারে Login করুন।"
                    );
                    return;
                }

                const startDate =
                    document.getElementById("startDate").value;

                const endDate =
                    document.getElementById("endDate").value;

                const snapshot =
                    await get(ref(reportDB, "transactions"));

                const data =
                    snapshot.exists()
                        ? snapshot.val()
                        : {};

                const transactions = toArray(data);

                const filtered =
                    transactions.filter(tx =>
                        tx &&
                        tx.date &&
                        tx.date >= startDate &&
                        tx.date <= endDate
                    );

                alert(
                    "Preview data ready! ✅\n\n" +
                    "Selected transactions: " +
                    filtered.length
                );

                console.log(
                    "REPORT PREVIEW:",
                    filtered
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Preview তৈরি করা যায়নি। ❌\n\n" +
                    error.message
                );

            }

        };

    </script>

</body>
</html>
