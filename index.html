<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Mousumi Computer</title>
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2176ff;
      --primary-dark: #0d233a;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e5e7eb;
      --green: #10b981;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 250px;
      background-color: var(--primary-dark);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: all 0.3s;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .brand-logo img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-logo h3 {
      font-size: 1.1rem;
      color: #ffffff;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      color: #a0aec0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: 0.2s;
    }

    .menu-item.active a, .menu-item a:hover {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-navbar {
      background-color: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-logout {
      background: #fee2e2;
      color: var(--red);
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background: var(--red);
      color: #fff;
    }

    /* Dashboard Container */
    .dashboard-container {
      padding: 30px;
    }

    /* Summary Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      border: 1px solid var(--border-color);
    }

    .card h4 {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .card .amount {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .card.income .amount { color: var(--green); }
    .card.expense .amount { color: var(--red); }
    .card.balance .amount { color: var(--primary-color); }

    /* Entry Form */
    .form-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .form-card h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--primary-dark);
    }

    .entry-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 15px;
    }

    .entry-form input, .entry-form select {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-add {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-add:hover {
      background-color: #1a65e0;
    }

    /* Transactions Table */
    .table-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    th {
      background-color: #f9fafb;
      color: #4b5563;
    }

    .badge-income {
      color: var(--green);
      font-weight: 600;
      background: #ecfdf5;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .badge-expense {
      color: var(--red);
      font-weight: 600;
      background: #fef2f2;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-delete {
      color: var(--red);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand-logo">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifAQVAOjeF0ccNQdBRY2gpfOlc19vjYbQiNjCUUJ9jJqxHEjVJB7nhST4fbzYcdaaV3DtoBrxxrhi4nQJsuwHoWnEmQKud8muKsZIRcWV6YgFLEmdsDc8TRv8Vcmw5jktkvXt4cnlRnbxOW8MlFzlJ4P7QSA7E1Owl9bxDsaW7wjMJQ91bdczQa5zjxu94/s1600/Screenshot_1.jpg" alt="MC Logo">
      <h3>Mousumi Computer</h3>
    </div>

    <ul class="menu-list">
      <li class="menu-item active"><a href="#"><i class="fa-solid fa-chart-line"></i> ড্যাশবোর্ড</a></li>
      <li class="menu-item"><a href="#"><i class="fa-solid fa-wallet"></i> হিসাব-নিকাশ</a></li>
      <li class="menu-item"><a href="#"><i class="fa-solid fa-book-bookmark"></i> বাকির খাতা</a></li>
      <li class="menu-item"><a href="#"><i class="fa-solid fa-boxes-stacked"></i> ইনভেন্টরি</a></li>
      <li class="menu-item"><a href="#"><i class="fa-solid fa-gear"></i> সেটিং</a></li>
    </ul>
  </div>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    
    <!-- Top Navbar -->
    <div class="top-navbar">
      <h2>অ্যাডমিন প্যানেল</h2>
      <div class="user-profile">
        <span><i class="fa-solid fa-circle-user"></i> প্রনব কুমার</span>
        <button class="btn-logout" onclick="alert('লগআউট সফল হয়েছে')"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-container">
      
      <!-- Cards -->
      <div class="cards-grid">
        <div class="card income">
          <h4>📊 আজ মোট বিক্রি (জমা)</h4>
          <div class="amount" id="totalIncome">৳ 0</div>
        </div>
        <div class="card expense">
          <h4>💸 আজ মোট খরচ</h4>
          <div class="amount" id="totalExpense">৳ 0</div>
        </div>
        <div class="card balance">
          <h4>💰 অবশিষ্ট ক্যাশ ব্যালেন্স</h4>
          <div class="amount" id="netBalance">৳ 0</div>
        </div>
      </div>

      <!-- Quick Entry Form -->
      <div class="form-card">
        <h3>📝 নতুন হিসাব এন্ট্রি করুন</h3>
        <form class="entry-form" id="transactionForm">
          <input type="text" id="desc" placeholder="কাজের বিবরণ (যেমন: টাইপিং/কাগজ ক্রয়)" required>
          <input type="number" id="amount" placeholder="টাকা (৳)" required>
          <select id="type">
            <option value="income">জমা (Cash In)</option>
            <option value="expense">খরচ (Cash Out)</option>
          </select>
          <button type="submit" class="btn-add">+ সেভ করুন</button>
        </form>
      </div>

      <!-- Transactions List -->
      <div class="table-card">
        <h3>📜 আজকের লেনদেনের তালিকা</h3>
        <table>
          <thead>
            <tr>
              <th>বিবরণ</th>
              <th>ধরন</th>
              <th>পরিমাণ</th>
              <th>মুছুন</th>
            </tr>
          </thead>
          <tbody id="transactionList">
            <!-- ডাইনামিক ডেটা আসবে -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    // LocalStorage Script for persistent offline entry
    let transactions = JSON.parse(localStorage.getItem('mc_transactions')) || [];

    const form = document.getElementById('transactionForm');
    const descInput = document.getElementById('desc');
    const amountInput = document.getElementById('amount');
    const typeInput = document.getElementById('type');
    const list = document.getElementById('transactionList');

    function updateUI() {
      list.innerHTML = '';
      let income = 0;
      let expense = 0;

      transactions.forEach((item, index) => {
        const row = document.createElement('tr');
        if (item.type === 'income') income += Number(item.amount);
        else expense += Number(item.amount);

        row.innerHTML = `
          <td>${item.desc}</td>
          <td><span class="${item.type === 'income' ? 'badge-income' : 'badge-expense'}">${item.type === 'income' ? 'জমা' : 'খরচ'}</span></td>
          <td>৳ ${item.amount}</td>
          <td><button class="btn-delete" onclick="deleteItem(${index})"><i class="fa-solid fa-trash"></i></button></td>
        `;
        list.appendChild(row);
      });

      document.getElementById('totalIncome').innerText = `৳ ${income}`;
      document.getElementById('totalExpense').innerText = `৳ ${expense}`;
      document.getElementById('netBalance').innerText = `৳ ${income - expense}`;

      localStorage.setItem('mc_transactions', JSON.stringify(transactions));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      transactions.push({
        desc: descInput.value,
        amount: amountInput.value,
        type: typeInput.value
      });
      descInput.value = '';
      amountInput.value = '';
      updateUI();
    });

    function deleteItem(index) {
      transactions.splice(index, 1);
      updateUI();
    }

    // Initial Load
    updateUI();
  </script>

</body>
</html>
