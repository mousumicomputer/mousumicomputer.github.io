<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Mousumi Computer</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2176ff;
      --primary-dark: #0d233a;
      --bg-color: #f2f4f7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e5e7eb;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d233a 0%, #2176ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .login-card {
      background-color: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    /* Language Switcher Dropdown Top Right */
    .lang-switcher-container {
      position: absolute;
      top: 15px;
      right: 15px;
    }

    .lang-select {
      background: #f3f4f6;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4b5563;
      outline: none;
      cursor: pointer;
    }

    /* Circular Logo Styling */
    .logo-container {
      margin-top: 10px;
      margin-bottom: 1.5rem;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.15);
      border: 3px solid #ffffff;
    }

    .shop-title {
      font-size: 1.4rem;
      color: var(--primary-dark);
      font-weight: 700;
      margin-top: 12px;
    }

    /* Form Design */
    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 12px;
      color: #9ca3af;
      font-size: 1rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 0.75rem 0.75rem 2.5rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(33, 118, 255, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .forgot-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Login Button */
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(33, 118, 255, 0.3);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #1a65e0;
      transform: translateY(-1px);
    }

    /* Back to Website Link (WordPress Style) */
    .back-to-site {
      margin-top: 20px;
      text-align: center;
    }

    .back-to-site a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-to-site a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <!-- Language Switcher Option -->
    <div class="lang-switcher-container">
      <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en" selected>🌐 EN</option>
        <option value="bn">🌐 BN</option>
      </select>
    </div>

    <!-- Circular Logo Section -->
    <div class="logo-container">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifAQVAOjeF0ccNQdBRY2gpfOlc19vjYbQiNjCUUJ9jJqxHEjVJB7nhST4fbzYcdaaV3DtoBrxxrhi4nQJsuwHoWnEmQKud8muKsZIRcWV6YgFLEmdsDc8TRv8Vcmw5jktkvXt4cnlRnbxOW8MlFzlJ4P7QSA7E1Owl9bxDsaW7wjMJQ91bdczQa5zjxu94/s1600/Screenshot_1.jpg" 
           onerror="this.onerror=null; this.src='https://i.ibb.co/6803Y30/Screenshot-1.jpg';" 
           alt="Mousumi Computer Logo" 
           class="logo-img">
      <h2 class="shop-title">Mousumi Computer</h2>
    </div>

    <form>
      <div class="form-group">
        <label for="username" id="label-username">Username or Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="user@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password" id="label-password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-actions">
        <label style="cursor: pointer;"><input type="checkbox"> <span id="label-remember">Remember me</span></label>
        <a href="#" class="forgot-link" id="label-forgot">Forgot Password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> <span id="label-btn">Log In</span>
      </button>
    </form>

  </div>

  <!-- WordPress Style Go to Website Link -->
  <div class="back-to-site">
    <a href="https://mousumicomputer.blogspot.com" id="label-back">← Go to MOUSUMI COMPUTER</a>
  </div>

  <script>
    /* Language Toggle Logic */
    const translations = {
      en: {
        username: "Username or Email",
        password: "Password",
        remember: "Remember me",
        forgot: "Forgot Password?",
        btn: "Log In",
        back: "← Go to MOUSUMI COMPUTER"
      },
      bn: {
        username: "ইউজারনেম বা ইমেইল",
        password: "পাসওয়ার্ড",
        remember: "মনে রাখুন",
        forgot: "পাসওয়ার্ড ভুলে গেছেন?",
        btn: "লগইন করুন",
        back: "← মৌসুমী কম্পিউটারে ফিরে যান"
      }
    };

    function changeLanguage(lang) {
      document.getElementById('label-username').innerText = translations[lang].username;
      document.getElementById('label-password').innerText = translations[lang].password;
      document.getElementById('label-remember').innerText = translations[lang].remember;
      document.getElementById('label-forgot').innerText = translations[lang].forgot;
      document.getElementById('label-btn').innerText = translations[lang].btn;
      document.getElementById('label-back').innerText = translations[lang].back;
    }
  </script>

</body>
</html>
