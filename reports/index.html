<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Download Center - Mousumi Computer</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .report-card {
            background: #ffffff;
            width: 100%;
            max-width: 950px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        /* Top Branding Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-title h2 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-title p {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }
        /* Quick Date Presets */
        .date-presets {
            display: flex;
            gap: 6px;
        }
        .preset-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover, .preset-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }
        /* Grid Layout for Fields */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .date-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-control, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            color: #0f172a;
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }
        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-preview {
            background-color: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-preview:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .btn-download {
            background-color: #2563eb;
            color: white;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            .grid-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="report-card">
        <!-- Header Section -->
        <div class="brand-header">
            <div class="brand-title">
                <h2><i class="fa-solid fa-layer-group" style="color: #2563eb;"></i> Mousumi Computer</h2>
                <p>Generate and export transaction summaries and ledgers</p>
            </div>
            <div class="date-presets">
                <button type="button" class="preset-btn active" onclick="setPreset('today', this)">Today</button>
                <button type="button" class="preset-btn" onclick="setPreset('week', this)">This Week</button>
                <button type="button" class="preset-btn" onclick="setPreset('month', this)">This Month</button>
            </div>
        </div>

        <!-- Main Options Grid -->
        <div class="grid-row">
            <!-- ১. ডেট রেঞ্জ -->
            <div class="form-group">
                <label><i class="fa-regular fa-calendar-days" style="color: #64748b;"></i> Date Range</label>
                <div class="date-input-group">
                    <input type="date" class="form-control" id="startDate">
                    <span style="color: #94a3b8; font-size: 12px;">to</span>
                    <input type="date" class="form-control" id="endDate">
                </div>
            </div>

            <!-- ২. রিপোর্টের ধরন -->
            <div class="form-group">
                <label><i class="fa-solid fa-file-lines" style="color: #64748b;"></i> Report Type</label>
                <select id="reportType" class="form-control">
                    <option value="transactions">Customer Transactions Report</option>
                    <option value="sales">Sales Summary</option>
                    <option value="expense">Expense Report</option>
                    <option value="profit-loss">Profit & Loss Statement</option>
                </select>
            </div>

            <!-- ৩. ফাইল ফরম্যাট -->
            <div class="form-group">
                <label><i class="fa-solid fa-file-arrow-down" style="color: #64748b;"></i> File Format</label>
                <select id="fileFormat" class="form-control">
                    <option value="pdf">PDF Document (.pdf)</option>
                    <option value="excel">Excel Spreadsheet (.xlsx)</option>
                    <option value="csv">CSV File (.csv)</option>
                </select>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
            <button type="button" class="btn btn-preview" onclick="alert('Generating live preview...')">
                <i class="fa-regular fa-eye"></i> Preview
            </button>
            <button type="button" class="btn btn-download" onclick="testFirebaseReport()">
    <i class="fa-solid fa-download"></i> Download Report
</button>
        </div>
    </div>

    <!-- JavaScript for Dynamic Date Selection -->
    <script>
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function setPreset(type, element) {
            // Active Button Style Toggle
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const today = new Date();
            const startDateObj = new Date();

            if (type === 'today') {
                document.getElementById('startDate').value = formatDate(today);
                document.getElementById('endDate').value = formatDate(today);
            } else if (type === 'week') {
                const dayOfWeek = today.getDay();
                startDateObj.setDate(today.getDate() - dayOfWeek); // Start of week (Sunday)
                document.getElementById('startDate').value = formatDate(startDateObj);
                document.getElementById('endDate').value = formatDate(today);
            } else if (type === 'month') {
                startDateObj.setDate(1); // First day of month
                document.getElementById('startDate').value = formatDate(startDateObj);
                document.getElementById('endDate').value = formatDate(today);
            }
        }

        // Initialize with Today's Date
        document.addEventListener('DOMContentLoaded', () => {
            setPreset('today', document.querySelector('.preset-btn.active'));
        });
    </script>
    <!-- Firebase Report Module -->
    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            getDatabase,
            ref,
            get
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        // =========================================================
        // MOUSUMI COMPUTER - FIREBASE CONFIG
        // =========================================================

        const firebaseConfig = {
            apiKey: "AIzaSyA1PhRiTkICNCd8sA4he3ZxKjHtIzM0d5E",
            authDomain: "mousumi-computer.firebaseapp.com",
            databaseURL: "https://mousumi-computer-default-rtdb.firebaseio.com",
            projectId: "mousumi-computer",
            storageBucket: "mousumi-computer.firebasestorage.app",
            messagingSenderId: "104820462623",
            appId: "1:104820462623:web:e3abae9533cc841463712a",
            measurementId: "G-EPYJ70W97Z"
        };


        // Firebase initialize
        const reportApp = initializeApp(
            firebaseConfig,
            "mousumiReportApp"
        );

        const reportAuth = getAuth(reportApp);
        const reportDB = getDatabase(reportApp);


        // =========================================================
        // CURRENT USER
        // =========================================================

        let reportCurrentUser = null;


        onAuthStateChanged(reportAuth, (user) => {

            reportCurrentUser = user || null;

            if (user) {
                console.log(
                    "Report Module Firebase Login:",
                    user.email
                );
            } else {
                console.log(
                    "Report Module: User is not logged in."
                );
            }

        });


        // =========================================================
        // TEST FIREBASE REPORT
        // =========================================================

        window.testFirebaseReport = async function () {

            try {

                // Login check
                if (!reportCurrentUser) {

                    alert(
                        "Firebase Login পাওয়া যায়নি।\n\n" +
                        "প্রথমে মূল Mousumi Computer সফটওয়্যারে Login করুন, " +
                        "তারপর Report Module খুলুন।"
                    );

                    return;
                }


                // Loading message
                const button = document.querySelector(".btn-download");

                if (button) {
                    button.disabled = true;
                    button.innerHTML =
                        '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
                }


                // =================================================
                // GET TRANSACTIONS
                // =================================================

                const transactionSnapshot =
                    await get(ref(reportDB, "transactions"));

                const transactionData =
                    transactionSnapshot.exists()
                        ? transactionSnapshot.val()
                        : {};


                // =================================================
                // GET CUSTOMERS
                // =================================================

                const customerSnapshot =
                    await get(ref(reportDB, "customers"));

                const customerData =
                    customerSnapshot.exists()
                        ? customerSnapshot.val()
                        : {};


                // Object / Array দুই ধরনের ডেটা সামলাবে
                const transactions =
                    Array.isArray(transactionData)
                        ? transactionData
                        : Object.values(transactionData || {});


                const customers =
                    Array.isArray(customerData)
                        ? customerData
                        : Object.values(customerData || {});


                // =================================================
                // TODAY FILTER
                // =================================================

                const today =
                    new Date().toISOString().split("T")[0];


                const todayTransactions =
                    transactions.filter(t => t && t.date === today);


                // =================================================
                // TOTAL
                // =================================================

                let totalDebit = 0;
                let totalCredit = 0;


                todayTransactions.forEach(t => {

                    totalDebit +=
                        parseFloat(t.debit) || 0;

                    totalCredit +=
                        parseFloat(t.credit) || 0;

                });


                // =================================================
                // RESTORE BUTTON
                // =================================================

                if (button) {

                    button.disabled = false;

                    button.innerHTML =
                        '<i class="fa-solid fa-download"></i> Download Report';

                }


                // =================================================
                // TEST RESULT
                // =================================================

                alert(
                    "Firebase Connection সফল! ✅\n\n" +

                    "Customer পাওয়া গেছে: " +
                    customers.length +
                    "\n\n" +

                    "মোট Transaction: " +
                    transactions.length +
                    "\n\n" +

                    "আজকের Transaction: " +
                    todayTransactions.length +
                    "\n\n" +

                    "আজকের Debit: " +
                    totalDebit.toFixed(2) +
                    "\n\n" +

                    "আজকের Credit: " +
                    totalCredit.toFixed(2)
                );


                // Console-এ আসল ডেটাও দেখা যাবে
                console.log(
                    "REPORT MODULE - CUSTOMERS:",
                    customers
                );

                console.log(
                    "REPORT MODULE - TRANSACTIONS:",
                    transactions
                );

                console.log(
                    "REPORT MODULE - TODAY TRANSACTIONS:",
                    todayTransactions
                );


            } catch (error) {

                console.error(
                    "Report Firebase Error:",
                    error
                );


                const button =
                    document.querySelector(".btn-download");

                if (button) {

                    button.disabled = false;

                    button.innerHTML =
                        '<i class="fa-solid fa-download"></i> Download Report';

                }


                alert(
                    "Firebase থেকে ডেটা আনা যায়নি। ❌\n\n" +
                    "Error:\n" +
                    error.message
                );

            }

        };

    </script>
</body>
</html>
