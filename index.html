<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Mousumi Computer</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2176ff;
      --primary-dark: #0d233a;
      --bg-color: #f2f4f7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e5e7eb;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d233a 0%, #2176ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .login-card {
      background-color: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    /* Logo Styling */
    .logo-container {
      margin-bottom: 1.2rem;
    }

    .logo-img {
      max-width: 140px;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.08);
    }

    .shop-title {
      font-size: 1.4rem;
      color: var(--primary-dark);
      font-weight: 700;
      margin-top: 10px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1.8rem;
    }

    /* Form Design */
    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 12px;
      color: #9ca3af;
      font-size: 1rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 0.75rem 0.75rem 2.5rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(33, 118, 255, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .forgot-link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Modern Redesigned Button */
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(33, 118, 255, 0.3);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #1a65e0;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <!-- লোগো সেকশন (আপনার আপলোড করা লোগোর লিংক দিয়ে আপডেট করা হয়েছে) -->
    <div class="logo-container">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEifAQVAOjeF0ccNQdBRY2gpfOlc19vjYbQiNjCUUJ9jJqxHEjVJB7nhST4fbzYcdaaV3DtoBrxxrhi4nQJsuwHoWnEmQKud8muKsZIRcWV6YgFLEmdsDc8TRv8Vcmw5jktkvXt4cnlRnbxOW8MlFzlJ4P7QSA7E1Owl9bxDsaW7wjMJQ91bdczQa5zjxu94/s1600/Screenshot_1.jpg" alt="Mousumi Computer Logo" class="logo-img">
      <h2 class="shop-title">Mousumi Computer</h2>
    </div>

    <p class="subtitle">এডমিন প্যানেলে প্রবেশ করতে তথ্য দিন</p>

    <form>
      <div class="form-group">
        <label for="username">ইউজারনেম বা ইমেইল</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="user@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">পাসওয়ার্ড</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-actions">
        <label style="cursor: pointer;"><input type="checkbox"> মনে রাখুন</label>
        <a href="#" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>

      <!-- রি-পজিশন করা সুন্দর বাটন -->
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
      </button>
    </form>
  </div>

</body>
</html>
